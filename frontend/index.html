<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/clever-match.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#17152b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clever Match</title>
    <script>
      if (location.hostname === 'tanzmatch-web.onrender.com') {
        location.replace('https://clevermatch.onrender.com' + location.pathname + location.search + location.hash);
      }
      // Unregister all service workers and clear all caches before React loads.
      // This prevents stale cached JS from causing blank screens.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
